name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  archives:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - run: cross build --release --bin kemuri --target "${{ matrix.target }}"
      - name: Create archive
        run: |
          name="kemuri-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/kemuri" "$name/"
          cp packaging/kemuri.yaml LICENSE README.md packaging/systemd/kemuri.service "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" >"$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256

  publish:
    needs: archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
      - run: cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
