[workspace]
resolver = "2"
members = [
    "crates/kemuri-core",
    "crates/kemuri-config",
    "crates/kemuri-probes",
    "crates/kemuri-storage",
    "crates/kemuri-server",
    "crates/kemuri-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stianfro/kemuri"

[workspace.dependencies]
kemuri-core = { path = "crates/kemuri-core" }
kemuri-config = { path = "crates/kemuri-config" }
kemuri-probes = { path = "crates/kemuri-probes" }
kemuri-storage = { path = "crates/kemuri-storage" }
kemuri-server = { path = "crates/kemuri-server" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
utoipa = "5"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
rand = "0.9"
rust-embed = "8"
mime_guess = "2"
url = "2"
http = "1"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
fs2 = "0.4"

socket2 = { version = "0.6", features = ["all"] }
hickory-resolver = "0.24"
futures = "0.3"
tokio-stream = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
panic = "unwind"
