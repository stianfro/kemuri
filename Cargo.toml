[workspace]
resolver = "2"
members = [
    "crates/kemuri-core",
    "crates/kemuri-config",
    "crates/kemuri-probes",
    "crates/kemuri-storage",
    "crates/kemuri-server",
    "crates/kemuri-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/stianfro/kemuri"

[workspace.dependencies]
kemuri-core = { path = "crates/kemuri-core" }
kemuri-config = { path = "crates/kemuri-config" }
kemuri-probes = { path = "crates/kemuri-probes" }
kemuri-storage = { path = "crates/kemuri-storage" }
kemuri-server = { path = "crates/kemuri-server" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
utoipa = "5"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
rand = "0.9"
rust-embed = "8"
mime_guess = "2"
url = "2"
http = "1"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"
fs2 = "0.4"
criterion = "0.8.2"

socket2 = { version = "0.6", features = ["all"] }
hickory-resolver = "0.24"
futures = "0.3"
tokio-stream = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
checksum = "sha256"
source-tarball = true
install-path = "CARGO_HOME"
install-updater = false
include = ["README.md", "LICENSE", "CHANGELOG.md", "packaging/kemuri.yaml", "packaging/systemd/kemuri.service"]

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
